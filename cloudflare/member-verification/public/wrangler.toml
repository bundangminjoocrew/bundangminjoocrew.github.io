name = "bunmink-verify-public"
main = "src/index.js"
compatibility_date = "2026-08-01"

[vars]
# 이 저장소는 organization/user Pages 루트로 배포되므로 Origin은 아래 값입니다.
ALLOWED_ORIGIN = "https://bundangminjoocrew.github.io"

[[d1_databases]]
binding = "DB"
database_name = "bunmink-verifications"
database_id = "57197fe4-aa95-41e7-bd65-2ff664cdf8c3"

[[d1_databases]]
binding = "MEMBERS_DB"
database_name = "bunmink-members"
database_id = "892a9280-de1b-4f37-afa3-360bc75c7e17"

[[r2_buckets]]
binding = "PROOFS"
bucket_name = "bunmink-verification-proofs"

[triggers]
crons = ["17 * * * *"]
